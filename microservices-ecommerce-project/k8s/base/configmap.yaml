apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  # Database configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "ecommerce"
  
  # Service ports
  PRODUCT_PORT: "8001"
  USER_PORT: "8002"
  ORDER_PORT: "8003"
  PAYMENT_PORT: "8004"
  INVENTORY_PORT: "8005"
  
  # Environment
  ENVIRONMENT: "production"
  NODE_ENV: "production"