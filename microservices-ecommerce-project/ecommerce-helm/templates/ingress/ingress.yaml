{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- if .Values.ingress.cors.enabled }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "{{ .Values.ingress.cors.allowOrigin }}"
    nginx.ingress.kubernetes.io/cors-allow-methods: "{{ .Values.ingress.cors.allowMethods }}"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - http:
      paths:
      {{- if .Values.services.product.enabled }}
      - path: /products(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.services.product.name }}
            port:
              number: {{ .Values.services.product.port }}
      {{- end }}
      {{- if .Values.services.user.enabled }}
      - path: /users(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.services.user.name }}
            port:
              number: {{ .Values.services.user.port }}
      {{- end }}
      {{- if .Values.services.order.enabled }}
      - path: /orders(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.services.order.name }}
            port:
              number: {{ .Values.services.order.port }}
      {{- end }}
      {{- if .Values.services.payment.enabled }}
      - path: /payments(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.services.payment.name }}
            port:
              number: {{ .Values.services.payment.port }}
      {{- end }}
      {{- if .Values.services.inventory.enabled }}
      - path: /inventory(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Values.services.inventory.name }}
            port:
              number: {{ .Values.services.inventory.port }}
      {{- end }}
{{- end }}
