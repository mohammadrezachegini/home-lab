{{- if .Values.monitoring.enabled }}
# =============================================================================
# Prometheus RBAC
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-role
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-role-binding
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-role
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: {{ .Values.monitoring.namespace }}
---
# =============================================================================
# Prometheus ConfigMap
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

      - job_name: 'product-service'
        static_configs:
          - targets: ['product-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.services.product.port }}']

      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.services.user.port }}']

      - job_name: 'order-service'
        static_configs:
          - targets: ['order-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.services.order.port }}']

      - job_name: 'payment-service'
        static_configs:
          - targets: ['payment-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.services.payment.port }}']

      - job_name: 'inventory-service'
        static_configs:
          - targets: ['inventory-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.services.inventory.port }}']
---
# =============================================================================
# Prometheus Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    app: prometheus
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: {{ .Values.monitoring.prometheus.image }}
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--web.enable-lifecycle"
        ports:
        - containerPort: {{ .Values.monitoring.prometheus.port }}
          name: http
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}
---
# =============================================================================
# Prometheus Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    app: prometheus
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: {{ .Values.monitoring.prometheus.port }}
    targetPort: {{ .Values.monitoring.prometheus.port }}
    nodePort: {{ .Values.monitoring.prometheus.nodePort }}
    name: http
{{- end }}
