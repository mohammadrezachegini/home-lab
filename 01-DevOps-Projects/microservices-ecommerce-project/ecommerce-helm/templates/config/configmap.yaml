apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
data:
  DB_HOST: "postgres-service"
  DB_PORT: "{{ .Values.postgres.port }}"
  DB_NAME: "{{ .Values.database.name }}"
  PRODUCT_PORT: "{{ .Values.services.product.port }}"
  USER_PORT: "{{ .Values.services.user.port }}"
  ORDER_PORT: "{{ .Values.services.order.port }}"
  PAYMENT_PORT: "{{ .Values.services.payment.port }}"
  INVENTORY_PORT: "{{ .Values.services.inventory.port }}"
  ENVIRONMENT: "{{ .Values.global.environment }}"
  NODE_ENV: "{{ .Values.global.environment }}"
