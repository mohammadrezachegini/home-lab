apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: ecommerce
type: Opaque
data:
  # Base64 encoded values
  # postgres = cG9zdGdyZXM=
  # To encode: echo -n 'yourvalue' | base64
  DB_USER: cG9zdGdyZXM=
  DB_PASSWORD: cG9zdGdyZXM=
stringData:
  # Plain text (automatically encoded)
  SECRET_KEY: "change-this-in-production"