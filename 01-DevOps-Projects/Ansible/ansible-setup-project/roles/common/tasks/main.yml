---
# ─────────────────────────────────────────
# Role: common
# Applies to: all nodes
# ─────────────────────────────────────────

- name: Set hostname
  hostname:
    name: "{{ node_name }}"

- name: Update /etc/hosts with cluster nodes
  blockinfile:
    path: /etc/hosts
    marker: "# {mark} HOMELAB CLUSTER NODES"
    block: |
      10.0.0.148  jarvis
      10.0.0.149  thor

- name: Update and upgrade apt packages
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - nmap
      - iptables
      - open-iscsi
      - nfs-common
      - software-properties-common
      - ca-certificates
      - gnupg
      - lsb-release
      - unattended-upgrades
      - apt-transport-https
    state: present

- name: Set timezone
  timezone:
    name: "{{ timezone }}"

- name: Disable swap immediately
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Disable swap in fstab permanently
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules on boot
  copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter

- name: Set sysctl parameters for Kubernetes networking
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-k3s.conf
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward",                 value: "1" }

- name: Enable iscsid for Longhorn
  systemd:
    name: iscsid
    enabled: yes
    state: started

- name: Install Docker
  block:
    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Add user to docker group
      user:
        name: "{{ lab_user }}"
        groups: docker
        append: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

- name: Install dev toolchains on worker node
  block:
    - name: Install Python tools
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
        state: present

    - name: Install Go
      block:
        - name: Download Go
          get_url:
            url: https://go.dev/dl/go1.22.4.linux-amd64.tar.gz
            dest: /tmp/go.tar.gz

        - name: Extract Go
          unarchive:
            src: /tmp/go.tar.gz
            dest: /usr/local
            remote_src: yes
            creates: /usr/local/go/bin/go

        - name: Add Go to PATH
          lineinfile:
            path: /home/{{ lab_user }}/.bashrc
            line: 'export PATH=$PATH:/usr/local/go/bin'
            state: present

    - name: Install Node.js via NodeSource
      block:
        - name: Download NodeSource setup script
          get_url:
            url: https://deb.nodesource.com/setup_20.x
            dest: /tmp/nodesource_setup.sh
            mode: '0755'

        - name: Run NodeSource setup
          command: bash /tmp/nodesource_setup.sh

        - name: Install Node.js
          apt:
            name: nodejs
            state: present
            update_cache: yes

  when: node_role == "worker"

- name: Reboot if kernel was upgraded
  reboot:
    msg: "Reboot triggered by Ansible after system upgrade"
    reboot_timeout: 120
  when: ansible_distribution_version is version('24.04', '>=')
