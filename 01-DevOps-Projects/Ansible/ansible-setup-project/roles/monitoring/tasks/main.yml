---
# ─────────────────────────────────────────
# Role: monitoring
# Applies to: control plane (UM773)
# Stack: Prometheus, Grafana, Loki, Promtail, Jaeger
# ─────────────────────────────────────────

- name: Add Helm repos for monitoring
  shell: |
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    helm repo add grafana https://grafana.github.io/helm-charts
    helm repo add jaegertracing https://jaegertracing.github.io/helm-charts
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create monitoring namespace
  shell: kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ── Prometheus + Grafana ──────────────────
- name: Install kube-prometheus-stack
  shell: |
    helm upgrade --install kube-prometheus-stack \
      prometheus-community/kube-prometheus-stack \
      --namespace monitoring \
      --set grafana.adminPassword={{ grafana_admin_password }} \
      --set prometheus.prometheusSpec.retention={{ prometheus_retention }} \
      --set grafana.service.type=LoadBalancer \
      --set prometheus.service.type=LoadBalancer \
      --set alertmanager.service.type=LoadBalancer \
      --set prometheus.prometheusSpec.nodeSelector."workload"=monitoring \
      --set grafana.nodeSelector."workload"=monitoring \
      --set alertmanager.alertmanagerSpec.nodeSelector."workload"=monitoring
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Grafana to be ready
  shell: |
    kubectl wait --namespace monitoring \
      --for=condition=ready pod \
      --selector=app.kubernetes.io/name=grafana \
      --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  retries: 3
  delay: 20

# ── Loki + Promtail ───────────────────────
- name: Install Loki
  shell: |
    helm upgrade --install loki grafana/loki \
      --namespace monitoring \
      --set deploymentMode=SingleBinary \
      --set loki.auth_enabled=false \
      --set loki.commonConfig.replication_factor=1 \
      --set loki.storage.type=filesystem \
      --set singleBinary.replicas=1 \
      --set singleBinary.nodeSelector."workload"=monitoring \
      --set read.replicas=0 \
      --set write.replicas=0 \
      --set backend.replicas=0 \
      --set loki.useTestSchema=true

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Promtail
  shell: |
    helm upgrade --install promtail grafana/promtail \
      --namespace monitoring \
      --set loki.serviceName=loki
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ── Jaeger ────────────────────────────────
- name: Install Jaeger
  shell: |
    helm upgrade --install jaeger jaegertracing/jaeger \
      --namespace monitoring \
      --set allInOne.enabled=true \
      --set collector.enabled=false \
      --set query.enabled=false \
      --set agent.enabled=false \
      --set storage.type=memory \
      --set allInOne.service.type=LoadBalancer \
      --set allInOne.nodeSelector."workload"=monitoring
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Print monitoring endpoints
  shell: kubectl get svc -n monitoring | grep LoadBalancer
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: monitoring_svcs

- name: Show monitoring service IPs
  debug:
    msg: "{{ monitoring_svcs.stdout_lines }}"

- name: Print access instructions
  debug:
    msg:
      - "════════════════════════════════════════"
      - " MONITORING STACK — ACCESS FROM ANY DEVICE ON YOUR NETWORK"
      - "════════════════════════════════════════"
      - " Open browser on MacBook, phone, tablet:"
      - " Grafana      → http://<LoadBalancer-IP>       admin / {{ grafana_admin_password }}"
      - " Prometheus   → http://<LoadBalancer-IP>:9090"
      - " Alertmanager → http://<LoadBalancer-IP>:9093"
      - " Jaeger       → http://<LoadBalancer-IP>:16686"
      - " Run: kubectl get svc -n monitoring to get exact IPs"
      - "════════════════════════════════════════"
