name: Cache Node and NPM Dependencies
description: This action allows to cache both Node and NPM dependencies based on the package-lock.json file.

inputs:
  node_version:
    description: The Node.js version to use
    required: true
    default: '20.x'
  working-dir:
    description: The working directory where package-lock.json is located
    required: false
    default: '.'

# outputs:

runs:
  using: composite
  steps:
  - name: Setup node js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ inputs.node_version }}
  - name: Cache NPM dependencies
    uses: actions/cache@v4
    with:
      path: ${{inputs.working-dir}}/node_modules
      key: node-modules-${{ inputs.target-env }}-${{ hashFiles(format('{0}/{1}', inputs.working-dir, 'package-lock.json')) }}
  - name: Install NPM dependencies
    if: steps.cache.outputs.cache-hit != 'true'
    run: ${{ inputs.target-env == 'dev' && 'npm install' || 'npm install --omit=dev' }}
    shell: bash
    working-directory: ${{ inputs.working-dir }}
